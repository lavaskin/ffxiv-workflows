name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Lint the workflows
        if: ${{ !cancelled() }}
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: Lint the scripts
        if: ${{ !cancelled() }}
        run: shellcheck release-plan/*.sh tests/*.sh

      - name: Test the release plan
        if: ${{ !cancelled() }}
        run: tests/release-plan.sh

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test the comment check
        if: ${{ !cancelled() }}
        run: tests/check-comments.sh
